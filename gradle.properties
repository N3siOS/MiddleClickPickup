# Gradle runtime options
org.gradle.daemon = true
org.gradle.jvmargs = -Xmx3G
org.gradle.parallel = true
org.gradle.caching = true

# Java / Hytale options
java_version = 25
hytale_version = 0.7.7

# Mod identity
group = dev.nesios
manifest_group = Nesios
mod_name = MdcPickup
main_class = dev.nesios.mdcpickup.MdcPickupPlugin
mod_author = Nesios
mod_id = MdcPickup
mod_license = MIT
mod_description = Enables pick-block in Adventure mode: middle-click a block to select the matching item from your inventory.
mod_url =
version = 1.1.0

# Manifest / packaging options
includes_pack = true
disabled_by_default = false

# Hytale patchline used for dependency resolution.
patchline = release

# Server version mirrored for tooling compatibility.
server_version = 0.7.7

# Server version range written into manifest.json.
manifestServerVersion = >=0.7.7 <0.8.0

# Required manifest dependencies (none for this plugin).
manifest_dependencies =

# Optional manifest dependencies.
manifest_opt_dependencies =

# CurseForge project ID used by update checking, if any.
curseforgeID =

# Injects hosted Hytale API docs into generated Vineflower server sources for easier IDE browsing.
injectServerJavadocsIntoSources = true

# Controls whether prepareDecompiledSourcesForIde / idea generate the large hytale-assets.jar IDE binary from Assets.zip.
generateAssetsBinary = false
